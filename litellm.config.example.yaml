# LiteLLM gateway config for Antonagents — enables OpenAI (and other non-Anthropic
# models) by translating the Anthropic protocol the agent speaks into each vendor's API.
#
# Setup:
#   1. cp litellm.config.example.yaml litellm.config.yaml   (edit as needed)
#   2. In .env set:
#        OPENAI_API_KEY=sk-...            # your REAL OpenAI key — used only by this
#                                         # gateway; Antonagents never sees it.
#        OPENAI_GATEWAY_KEY=<any secret>  # a secret you choose; this gateway's
#                                         # master_key AND what Antonagents uses to
#                                         # authenticate to the gateway.
#   3. docker compose --profile litellm up
#   4. In Antonagents pick provider "OpenAI (via LiteLLM gateway)" → the model dropdown
#      is populated live from this file (via /v1/models).
#
# IMPORTANT — reasoning models only. Antonagents's agent runs with extended thinking,
# which LiteLLM forwards to OpenAI as `reasoning_effort`. OpenAI REASONING models
# (the GPT-5 family and the o-series) accept it; NON-reasoning models (gpt-4o,
# gpt-4.1) reject it and error. So list reasoning models here. Add newer variants
# your key has access to the same way (e.g. gpt-5.1, gpt-5.2, gpt-5-pro).

model_list:
  # GPT-5.6 is the current frontier series (reasoning). Access varies by key —
  # remove any that error for you. Other variants: gpt-5.6-terra, gpt-5.6-luna, gpt-5.2.
  - model_name: gpt-5.6-sol
    litellm_params: { model: openai/gpt-5.6-sol, api_key: os.environ/OPENAI_API_KEY }
  # GPT-5 family (broadly available, reasoning)
  - model_name: gpt-5
    litellm_params: { model: openai/gpt-5, api_key: os.environ/OPENAI_API_KEY }
  - model_name: gpt-5-mini
    litellm_params: { model: openai/gpt-5-mini, api_key: os.environ/OPENAI_API_KEY }
  - model_name: gpt-5-nano
    litellm_params: { model: openai/gpt-5-nano, api_key: os.environ/OPENAI_API_KEY }
  # o-series reasoning models
  - model_name: o3
    litellm_params: { model: openai/o3, api_key: os.environ/OPENAI_API_KEY }
  - model_name: o4-mini
    litellm_params: { model: openai/o4-mini, api_key: os.environ/OPENAI_API_KEY }

  # Other vendors work the same way (then they appear in the dropdown too), e.g. Gemini:
  # - model_name: gemini-2.5-pro
  #   litellm_params: { model: gemini/gemini-2.5-pro, api_key: os.environ/GEMINI_API_KEY }

litellm_settings:
  drop_params: true   # tolerate params a given model doesn't support

general_settings:
  # Antonagents authenticates to this gateway with OPENAI_GATEWAY_KEY (sent as a
  # Bearer token); it must equal this master_key.
  master_key: os.environ/OPENAI_GATEWAY_KEY
